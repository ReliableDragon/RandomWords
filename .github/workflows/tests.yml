name: Tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The tool itself runs on Python 3.9+, but the test suite uses
        # parenthesised multi-line `with` statements (see README.md's
        # "Requirements" section), which need 3.10+. That is why the
        # matrix starts at 3.10 rather than 3.9.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Standard library only: nothing to install before running the tests.
      - run: ./run_tests.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.6
      - run: ruff check .
